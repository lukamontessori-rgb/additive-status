{% extends "base.html" %}
{% from "_macros.html" import search_box %}
{% block main %}
<section class="notfound">
  <p class="nf-code" aria-hidden="true"><span class="st st-no"><i>✕</i>404</span></p>
  <h1>This page is not on the list</h1>
  <p class="lede">It may have moved, or the address has a typo. Try a search instead:</p>
  {{ search_box('q-404', big=True) }}
  <p class="hero-actions">
    <a class="btn btn-soft" href="{{ url('/') }}">Home</a>
    <a class="btn btn-soft" href="{{ url('/additives/') }}">All additives</a>
    <a class="btn btn-soft" href="{{ url('/additives/') }}" data-random><span aria-hidden="true">🎲</span> Random additive</a>
  </p>
</section>
{% endblock %}
