name: Update data and site

# Sources change on a scale of weeks (EU consolidations, FDA inventory
# updates, Health Canada list notices), so a weekly check is enough.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/raw/**"
      - "data/published/**"
      - "**.md"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch sources
        # Failures are recorded in data/raw/*/meta.json and judged by build_data;
        # a failed source never overwrites its last good snapshot.
        continue-on-error: true
        run: python -m pipeline.fetch

      - name: Commit raw snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if ! git diff --cached --quiet; then
            git commit -m "Raw source snapshot $(date -u +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Build and validate data
        run: python -m pipeline.build_data

      - name: Run tests
        run: python -m pytest -q

      - name: Commit published data
        run: |
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Published data $(date -u +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Build site
        run: python -m web.build

      - name: Check site
        run: python -m web.check dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Report problems as an issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let problems = [];
            try {
              const h = JSON.parse(fs.readFileSync('data/published/health.json', 'utf8'));
              problems = h.problems || [];
            } catch (e) {
              problems = ['Pipeline did not produce data/published/health.json'];
            }
            if ('${{ job.status }}' !== 'success') problems.unshift('Workflow job status: ${{ job.status }}');
            const title = 'Data pipeline needs attention';
            const {data: open} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'pipeline'});
            const existing = open.find(i => i.title === title);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (problems.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body: `Resolved in ${run}`});
                await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed'});
              }
              return;
            }
            const body = `Run: ${run}\n\n` + problems.map(p => `- ${p}`).join('\n') +
              '\n\nThe site keeps showing the last validated data until this is fixed.';
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pipeline']});
            }

  deploy:
    needs: data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
