# Registry of every external source the pipeline reads.
# Each entry says what it is, where it lives, how it is fetched,
# its licence and the attribution line we must show.

eu_annex2:
  title: "Regulation (EC) No 1333/2008 on food additives — consolidated text"
  publisher: "Publications Office of the European Union / European Commission"
  kind: eurlex_latest
  celex_base: "02008R1333"
  sparql_endpoint: "https://publications.europa.eu/webapi/rdf/sparql"
  cellar_url: "https://publications.europa.eu/resource/celex/{celex}"
  html_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:{celex}"
  must_contain: "ANNEX II"
  file: "annex2.html"
  licence: "Reuse authorised, source must be acknowledged (Commission Decision 2011/833/EU; EUR-Lex legal notice)"
  licence_url: "https://eur-lex.europa.eu/content/legal-notice/legal-notice.html"
  attribution: "© European Union, https://eur-lex.europa.eu/"
  critical: true

uk_fsa:
