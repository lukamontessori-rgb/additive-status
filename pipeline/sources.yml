anz_code:
  title: "Australia New Zealand Food Standards Code — compilation (Standard 1.3.1, Schedules 8, 15, 16 and 18)"
  publisher: "Food Standards Australia New Zealand (FSANZ)"
  kind: discover_file
  page_url: "https://www.foodstandards.gov.au/food-standards-code/legislation"
  link_regex: 'href="([^"]*Food%20Standards%20Code%20-%20Compilation[^"]*\.pdf)"'
  file: "compilation.pdf"
  magic: "%PDF"
  licence: "Creative Commons Attribution 4.0 (CC BY 4.0)"
