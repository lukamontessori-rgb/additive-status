# Extra notes shown with a Canadian status (reviewed).
ca_notes:
  e952: "Canada allows cyclamate only in table-top sweeteners sold under Part E of the Food and Drug Regulations, not as a food additive."

# Substances not in the Food Standards Code additive schedules that may be permitted in another way.
anz_uncertain:
  ca-alpha-cyclodextrin: "Not in the food additive schedules. It may be permitted in Australia and New Zealand under another standard (for example as a novel food), which this site does not cover."
  ca-calcium-iodate: "Not in the food additive schedules. Iodine compounds can be permitted as nutritive substances or for iodised salt under other standards, which this site does not cover."
  ca-potassium-iodate: "Not in the food additive schedules. Iodine compounds can be permitted as nutritive substances or for iodised salt under other standards, which this site does not cover."
